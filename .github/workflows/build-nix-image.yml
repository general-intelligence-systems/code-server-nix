name: Build Nix Docker Image

on:
  push:
    branches: [trench]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-nix

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main branch (full repo for build)
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          path: main

      - name: Checkout trench branch (Dockerfile + entrypoint)
        uses: actions/checkout@v4
        with:
          ref: trench
          path: trench

      - name: Install native build dependencies
        run: sudo apt update && sudo apt install -y libkrb5-dev

      - name: Install quilt and apply patches
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: quilt
          version: 1.0
      - run: quilt push -a
        working-directory: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: main/.node-version

      - name: Install code-server dependencies
        run: npm ci
        working-directory: main

      - name: Build code-server release packages (.deb)
        run: |
          npm run build
          npm run build:vscode
          npm run release
          npm run release:standalone
          npm run package
        working-directory: main

      - name: Overlay trench files into build context
        run: |
          cp trench/Dockerfile main/ci/release-image/Dockerfile
          cp trench/entrypoint.sh main/ci/release-image/entrypoint.sh

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(jq -r .version main/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: main
          file: main/ci/release-image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
